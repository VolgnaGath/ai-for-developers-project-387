name: opencode-lighthouse

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Warm up the app
        run: |
          curl -s -o /dev/null -w "warm-up HTTP %{http_code}\n" https://ai-for-developers-project-387-njkb.onrender.com
          sleep 30

      - name: Run Lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx --yes lighthouse \
            "https://ai-for-developers-project-387-njkb.onrender.com" \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--no-sandbox"

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ./lighthouse-report.json

      - name: Run OpenCode review
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          share: false
          use_github_token: true
          prompt: |
            Ты — ночная проверка производительности Call Calendar.

            Открой результат прогона Lighthouse в `./lighthouse-report.json` (структура: categories.performance/accessibility/seo/best-practices — score 0..1, audits.largest-contentful-paint/audits.cumulative-layout-shift/audits.interaction-to-next-paint — displayValue) и бейзлайн в `docs/performance-baseline.md` (markdown-таблица).

            Первичный сигнал — баллы категорий performance/accessibility/seo/best-practices. Вторичный (чувствителен к холодному старту) — LCP/CLS/INP.

            Действия:
            - Если `docs/performance-baseline.md` отсутствует — НЕ создавай issue, только отчитайся в финальном сообщении.
            - Если регрессия категории >10% (сравнение с бейзлайном) ИЛИ просадка хотя бы одной категории — создай issue по шаблону bug report: метрики «до/после», ссылка на артефакт lighthouse-report, рекомендации. Метка `bug`. Issue-шаблон прилагается в `.github/ISSUE_TEMPLATE/bug_report.yml`.
            - Иначе — не создавай никаких issues, в финальном сообщении напиши краткий свод метрик.

            Не редактируй код, не пуши в main, не открывай PR.
